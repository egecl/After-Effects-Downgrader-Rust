[package]
name = "ae-downgrade-toolkit-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["ico"] }
raw-window-handle = "0.6"

[build-dependencies]
winres = "0.1"


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }